<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMP 算法可视化</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1c1c;--mute:#8a8a85;--line:#dcdcd7;--cw:38px;
--ok:#2f9e6f;--okbg:#e4f4ec;--bad:#d64545;--badbg:#fbe6e6;
--pre:#3b6fd4;--prebg:#e5edfb;--suf:#d98324;--sufbg:#fbeedd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:22px;font-weight:600;margin:0}
.sub{color:var(--mute);margin:4px 0 20px}
h2{font-size:16px;font-weight:600;margin:0 0 4px}
h2 small{font-weight:400;color:var(--mute);margin-left:8px;font-size:13px}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
section{border-top:1px solid var(--line);padding:24px 0 8px}
.inputs{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:20px}
label{color:var(--mute);font-size:13px}
input,select,button{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);padding:4px 10px}
input{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;margin-left:6px}
#P{width:170px}#T{width:330px}
button{cursor:pointer}button:hover{border-color:#999}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.step{color:var(--mute);font-size:13px;margin-left:6px}
.scroll{overflow-x:auto;padding:4px 0 10px}
.stage{width:max-content;min-width:100%}
.line{display:flex;align-items:center;height:calc(var(--cw) + 2px)}
.line.sm{height:22px}
.lab{position:sticky;left:0;z-index:3;width:76px;flex:none;height:100%;display:flex;align-items:center;color:var(--mute);font-size:13px;background:var(--bg)}
.strip{display:flex;flex:none;transition:transform .45s ease,opacity .3s}
.hide{opacity:0}
.c{width:var(--cw);height:var(--cw);display:flex;align-items:center;justify-content:center;background:#fff;
border:1px solid var(--line);border-right-width:0;font:500 18px ui-monospace,Menlo,Consolas,monospace;
transition:background .2s,color .2s}
.strip .c:last-child{border-right-width:1px}
.idx .c,.mk{border:0;background:none;height:20px;font-size:11px;color:var(--mute)}
.mk{width:var(--cw);font-size:12px;font-weight:600;color:var(--fg);font-family:ui-monospace,Menlo,monospace}
.c.ok{background:var(--okbg);color:var(--ok)}
.c.bad{background:var(--badbg);color:var(--bad)}
.c.now{box-shadow:inset 0 0 0 2px currentColor}
.c.now:not(.ok):not(.bad){color:var(--fg);box-shadow:inset 0 0 0 2px #999}
.c.skip{background:#efefec;color:#b5b5b0}
.c.pre{background:var(--prebg);color:var(--pre)}
.c.suf{background:var(--sufbg);color:var(--suf)}
.c.pre.suf{background:linear-gradient(135deg,var(--prebg) 50%,var(--sufbg) 50%);color:var(--fg)}
.c.dim{opacity:.35}
.click{cursor:pointer}
.c.sel{box-shadow:inset 0 0 0 2px var(--pre);background:var(--prebg);color:var(--pre)}
.c.use{box-shadow:inset 0 0 0 2px var(--suf);background:var(--sufbg);color:var(--suf)}
.gap{height:14px}
.msg{min-height:48px;font-size:14px;margin:6px 0 0}
.msg .k{font:600 14px ui-monospace,Menlo,monospace}
.msg .g{color:var(--ok);font-weight:600}.msg .r{color:var(--bad);font-weight:600}
.tag{display:inline-block;padding:0 7px;border-radius:4px;font-size:12px;margin-right:6px}
.tag.pre{background:var(--prebg);color:var(--pre)}.tag.suf{background:var(--sufbg);color:var(--suf)}
.stats{margin:8px 0 10px;display:grid;gap:4px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.bar span{width:40px}.bar b{width:34px;color:var(--fg);font-weight:600;text-align:right}
.trk{flex:1;max-width:360px;height:6px;background:#ebebe7;border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;width:0;transition:width .3s}
</style>
</head>
<body>
<main>
<h1>KMP 字符串匹配</h1>
<p class="sub">主串指针 <b>i</b> 永不回退；失配时只回退模式串指针 <b>j</b>。</p>

<div class="inputs">
  <label>模式串 P<input id="P" value="ABABCABAB" maxlength="14" spellcheck="false"></label>
  <label>主串 T<input id="T" value="ABABDABACDABABCABAB" maxlength="30" spellcheck="false"></label>
  <select id="pre" aria-label="示例"></select>
</div>

<section>
  <h2>① next[j] 的含义</h2>
  <p class="hint">点击任一位置 j。next[j] = k ⇔ P[1..k-1] = P[j-k+1..j-1]，k−1 为 P[1..j-1] 的最长相等前后缀长度。</p>
  <div id="concept"></div>
</section>

<section>
  <h2>② 构造 next 表<small>模式串与自身匹配</small></h2>
  <p class="hint">t<sub>j</sub> = t<sub>k</sub>：next[j+1] = k+1；否则 k = next[k]。上行 P 作主串，下行 P 滑动。</p>
  <div id="build"></div>
</section>

<section>
  <h2>③ 匹配<small>i 只前进，j 依 next 回退</small></h2>
  <p class="hint">绿 = 匹配，红 = 失配，灰 = 被跳过的起点，橙 = 正在查阅的 next 项。</p>
  <div id="match"></div>
</section>
</main>

<script>
const CW=38,$=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kb=x=>`<b class="k">${esc(x)}</b>`;
const strip=(s,cls)=>{const d=el('div','strip '+(cls||''));for(const ch of s)d.append(el('div','c',ch));return d};
const line=(lab,st,sm)=>{const l=el('div','line'+(sm?' sm':''));const b=el('div','lab',lab);l.append(b,st);l.lab=b;return l};
const numStrip=(n,cls)=>{const d=el('div','strip '+(cls||''));for(let k=1;k<=n;k++)d.append(el('div','c',k));return d};

// 教材 next：下标从 1 起；nx[j-1] = next[j]，长度 m+1（含 next[m+1]，用于找到匹配后继续）
const calcNext=p=>{const pi=[0];for(let i=1,j=0;i<p.length;i++){while(j&&p[i]!==p[j])j=pi[j-1];if(p[i]===p[j])j++;pi[i]=j}return[0,...pi.map(v=>v+1)]};
const brute=(T,P)=>{let c=0;for(let s=0;s+P.length<=T.length;s++)for(let k=0;k<P.length;k++){c++;if(T[s+k]!==P[k])break}return c};

// 帧中 i、j 均为 1 起的下标；j=0 表示 next 回退到 0
function matchFrames(T,P,nx){
  const n=T.length,m=P.length,F=[],fs=[];let i=1,j=1,c=0;
  const push=o=>F.push({c,fs:fs.slice(),...o});
  push({t:'start',i,j});
  while(i<=n){
    const ok=T[i-1]===P[j-1];c++;
    push({t:'cmp',i,j,ok});
    if(ok){
      i++;j++;
      if(j>m){
        fs.push(i-m);push({t:'found',i,j,start:i-m});
        const jt=nx[m];
        if(i<=n)push({t:'shift',i,jFrom:j,jTo:jt});
        j=jt;
      }
    }else{
      const jt=nx[j-1];push({t:'shift',i,jFrom:j,jTo:jt});j=jt;
      if(j===0){i++;j=1}
    }
  }
  push({t:'end',i,j});
  return F;
}

function buildFrames(P){
  const m=P.length,F=[],nx=Array(m).fill(null);nx[0]=0;
  const push=o=>F.push({nx:nx.slice(),c:0,fs:[],...o});
  if(m>1)nx[1]=1;
  push({t:'start',i:1,j:0,set:m>1?1:0});
  let j=2,k=1;
  while(j<m){
    if(P[j-1]===P[k-1]){nx[j]=k+1;push({t:'cmp',i:j,j:k,ok:true,set:j});j++;k++}
    else{
      push({t:'cmp',i:j,j:k,ok:false});
      const kk=nx[k-1];
      if(kk===0){nx[j]=1;push({t:'shift',i:j,jFrom:k,jTo:0,set:j});j++;k=1}
      else{push({t:'shift',i:j,jFrom:k,jTo:kk});k=kk}
    }
  }
  push({t:'end',i:j,j:k});
  return F;
}

function Viz(root,o){
  root._stop&&root._stop();
  root.innerHTML='';
  const {top,pat,frames,mode}=o,n=top.length,m=pat.length,last=frames.length-1,B=mode==='build';
  let idx=0,timer=null;

  const ctl=el('div','ctl');
  const btn=(t,f)=>{const b=el('button',null,t);b.onclick=f;ctl.append(b);return b};
  btn('重置',()=>{stop();go(0)});
  btn('‹ 上一步',()=>{stop();go(idx-1)});
  btn('下一步 ›',()=>{stop();go(idx+1)});
  const bPlay=btn('自动播放',()=>timer?stop():play());
  const sp=el('select');[['慢',1200],['中',700],['快',300]].forEach(([t,v])=>sp.append(new Option(t,v)));sp.value=700;
  sp.onchange=()=>{if(timer){stop();play()}};
  const stepEl=el('span','step');
  ctl.append(sp,stepEl);

  const sc=el('div','scroll'),st=el('div','stage');
  const idxS=numStrip(n,'idx'),mi=el('div','strip hide'),mj=el('div','strip hide');
  const miC=el('div','mk'),mjC=el('div','mk');mi.append(miC);mj.append(mjC);
  const tS=strip(top),pS=strip(pat);pS.classList.add('hide');
  const kS=numStrip(m,'idx'),nS=strip('0'.repeat(m));
  const tC=[...tS.children],pC=[...pS.children],nC=[...nS.children];
  const labs=B?['P (j)','P 平移 (k)']:['主串 T','模式串 P'];
  st.append(line('',idxS,1),line('',mi,1),line(labs[0],tS),line(labs[1],pS),line('',mj,1),el('div','gap'),line('j',kS,1),line('next[j]',nS));
  sc.append(st);

  const msg=el('div','msg');
  let stats=null,bK,bB,nK,nB;
  const Bt=B?0:brute(top,pat),Kt=frames[last].c,mx=Math.max(Bt,Kt,1);
  if(!B){
    stats=el('div','stats');
    const row=(name,color)=>{const r=el('div','bar'),t=el('div','trk'),i=el('i'),b=el('b');i.style.background=color;t.append(i);r.append(el('span',null,name),t,b);stats.append(r);return[i,b]};
    [bK,nK]=row('KMP','var(--ok)');[bB,nB]=row('暴力','#b9b9b3');
    bB.style.width=(Bt/mx*100)+'%';nB.textContent=Bt;
  }
  root.append(ctl,sc,msg);if(stats)root.append(stats);

  function text(f){
    const {t,i}=f,arr=B?f.nx:o.nx,X=B?'P':'T',p=B?'k':'j';
    if(t==='start')return B?`next[1] = 0；k=0 时 next[2] = 1，取 j=2, k=1。`:'点击“下一步”开始。';
    if(t==='cmp'){
      const a=kb(top[i-1]),b=kb(pat[f.j-1]);
      if(f.ok)return `${X}[${i}] = ${a} = P[${f.j}] <span class="g">✓</span> → `+(B?`next[${i+1}] = ${f.j+1}，j++, k++`:'i++, j++');
      return `${a} ≠ ${b} <span class="r">✗</span> → ${p} = next[${f.j}] = ${arr[f.j-1]}`;
    }
    if(t==='shift'){
      if(f.jTo===0)return B?`k = 0 → next[${i+1}] = 1，j++, k=1`:`j = 0 → i++, j=1（模式右移 1 位）`;
      return `${p}：${f.jFrom} → ${f.jTo}；模式右移 ${f.jFrom-f.jTo} 位，前 ${f.jTo-1} 个字符无需重比`;
    }
    if(t==='found')return `<span class="g">匹配成功</span>，起点 ${f.start}`;
    return B?'next 表构造完成。':(f.fs.length?`完成：匹配起点 ${f.fs.join(', ')}`:'完成：未找到匹配');
  }

  function draw(){
    const f=frames[idx],t=f.t,ci=f.i-1,jj=t==='shift'?f.jTo:f.j,b=jj-1,off=ci-b;
    const tc=Array(n).fill('c'),pc=Array(m).fill('c');
    const add=(a,k,c)=>{if(k>=0&&k<a.length)a[k]+=' '+c};
    f.fs.forEach(s=>{for(let k=s-1;k<s-1+m;k++)add(tc,k,'ok')});
    if(t==='cmp'){
      for(let k=ci-b;k<ci;k++)add(tc,k,'ok');
      for(let k=0;k<b;k++)add(pc,k,'ok');
      const s=f.ok?'ok now':'bad now';add(tc,ci,s);add(pc,b,s);
    }else if(t==='shift'){
      const a=f.jFrom-1;
      for(let k=ci-a;k<ci-Math.max(b,0);k++)add(tc,k,'skip');
      for(let k=ci-b;k<ci;k++)add(tc,k,'ok');
      for(let k=0;k<b;k++)add(pc,k,'ok');
      add(tc,ci,'now');add(pc,b,'now');
    }else if(t==='found')pc.fill('c ok');
    tC.forEach((c,k)=>c.className=tc[k]);pC.forEach((c,k)=>c.className=pc[k]);
    pS.style.transform=`translateX(${off*CW}px)`;
    mi.style.transform=mj.style.transform=`translateX(${ci*CW}px)`;
    miC.textContent=`${B?'j':'i'}=${f.i}`;mjC.textContent=`${B?'k':'j'}=${jj}`;
    [pS,mi,mj].forEach(x=>x.classList.toggle('hide',t==='start'&&!B||t==='end'));
    const arr=B?f.nx:o.nx;
    const use=t==='shift'?f.jFrom-1:(t==='cmp'&&!f.ok?f.j-1:-1);
    nC.forEach((c,k)=>{c.textContent=arr[k]==null?'':arr[k];c.className='c'+(k===f.set?' sel':'')+(k===use?' use':'')});
    msg.innerHTML=text(f);
    stepEl.textContent=`${idx} / ${last}`;
    if(stats){bK.style.width=(f.c/mx*100)+'%';nK.textContent=f.c}
    sc.scrollTo({left:Math.max(0,(ci+1)*CW-sc.clientWidth/2),behavior:'smooth'});
  }
  function go(k){idx=Math.max(0,Math.min(last,k));draw()}
  function stop(){clearInterval(timer);timer=null;bPlay.textContent='自动播放'}
  function play(){
    if(idx>=last)go(0);
    bPlay.textContent='暂停';
    timer=setInterval(()=>{if(idx>=last)stop();else go(idx+1)},+sp.value);
  }
  root._stop=stop;
  draw();
}

function concept(P,nx){
  const root=$('#concept');root.innerHTML='';
  const m=P.length;let j=1+nx.slice(0,m).indexOf(Math.max(...nx.slice(0,m)));
  const sc=el('div','scroll'),st=el('div','stage');
  const pS=strip(P),qS=strip(P),nS=strip('0'.repeat(m)),kS=numStrip(m,'idx');
  const pC=[...pS.children],qC=[...qS.children],nC=[...nS.children];
  const ql=line('',qS);
  st.append(line('j',kS,1),line('P',pS),ql,el('div','gap'),line('next[j]',nS));
  sc.append(st);
  const msg=el('div','msg');root.append(sc,msg);
  pC.forEach((c,x)=>c.onclick=()=>{j=x+1;draw()});
  nC.forEach((c,x)=>c.onclick=()=>{j=x+1;draw()});
  function draw(){
    const k=nx[j-1],b=Math.max(k-1,0),s=j-k;
    pC.forEach((c,x)=>{
      let cl='c click';
      if(x===j-1)cl+=' bad';else if(x>j-1)cl+=' dim';
      else{if(x<b)cl+=' pre';if(x>=j-1-b)cl+=' suf'}
      c.className=cl;
    });
    qC.forEach((c,x)=>c.className='c'+(x<b?' pre':x===b?' now':' dim'));
    qS.style.transform=`translateX(${s*CW}px)`;
    qS.classList.toggle('hide',j===1);ql.lab.textContent=j===1?'':`右移 ${s}`;
    nC.forEach((c,x)=>{c.textContent=nx[x];c.className='c click'+(x===j-1?' sel':'')});
    if(j===1){msg.innerHTML=`next[1] = 0：在 P[1] 处失配，无可回退，主串指针 i 直接前进。`;return}
    const head=`P[1..${j-1}] = ${kb(P.slice(0,j-1))}`;
    msg.innerHTML=b
      ?`${head}　<span class="tag pre">前缀</span><span class="tag suf">后缀</span>${kb(P.slice(0,b))}（长 ${b}）→ next[${j}] = ${b}+1 = ${k}<br>在 P[${j}] 处失配：用 P[${k}] 继续比较，模式右移 ${s} 位`
      :`${head}　无相等的真前缀与真后缀 → next[${j}] = 1<br>在 P[${j}] 处失配：用 P[1] 继续比较，模式右移 ${s} 位`;
  }
  draw();
}

const PRESETS=[
  ['示例：经典','ABABDABACDABABCABAB','ABABCABAB'],
  ['示例：暴力法最坏情形','AAAAAAAAAAAAAAAB','AAAAB'],
  ['示例：多处匹配','ABCABCABCABCAB','ABCAB'],
  ['示例：无匹配','ABCDEFGHIJKLMNO','ABCE']
];
PRESETS.forEach(([n],i)=>$('#pre').append(new Option(n,i)));
$('#pre').onchange=e=>{const[,T,P]=PRESETS[e.target.value];$('#T').value=T;$('#P').value=P;refresh()};

function refresh(){
  const P=$('#P').value,T=$('#T').value;
  ['#concept','#build','#match'].forEach(s=>{$(s)._stop&&$(s)._stop();$(s).innerHTML=''});
  if(!P||!T)return;
  const nx=calcNext(P);
  concept(P,nx);
  Viz($('#build'),{top:P,pat:P,frames:buildFrames(P),mode:'build'});
  Viz($('#match'),{top:T,pat:P,frames:matchFrames(T,P,nx),nx,mode:'match'});
}
$('#P').oninput=$('#T').oninput=refresh;
refresh();
</script>
</body>
</html>
